spring:
  application.name: soht2-client
  profiles.include: client
  devtools.add-properties: false
  main:
    banner-mode: off
    web-application-type: none
  pid:
    file: ./soht2-client.pid
    fail-on-write-error: true
  jackson:
    date-format: tools.jackson.databind.util.StdDateFormat
    datatype:
      datetime:
        write-dates-as-timestamps: false
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  threads.virtual.enabled: true
  # A duplex download is held by the server for up to soht2.server.download-hold-timeout (25s by
  # default), so the read timeout of the default HTTP client must be longer than that.
  http.clients.read-timeout: PT60S
  # Apache HttpClient 5 is the only transport; HttpClientConfig customizes it for every mode.
  http.clients.imperative.factory: http-components

logging.level:
  root: info

soht2.client:
  url: http://localhost:8080/api/connection
  transport: duplex
  socket-read-timeout: PT0.1S
  read-buffer-size: 1MB
  compression:
    type: none
    min-request-size: 2KB
  poll:
    strategy: exponent
    initial-delay: PT0.1S
    max-delay: PT1S
    factor: 5
  disable-ssl-verification: false
  disconnect-on-idle-timeout: PT0S
