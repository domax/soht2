spring:
  application.name: soht2-server
  profiles.include: server
  devtools.add-properties: false
  main.banner-mode: off
  threads.virtual.enabled: true
  jackson:
    date-format: tools.jackson.databind.util.StdDateFormat
    datatype:
      datetime:
        write-dates-as-timestamps: false
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
  datasource:
    url: jdbc:h2:file:${soht2.server.database-path}
    username: ${soht2.server.admin-username}
    password: ${soht2.server.default-admin-password}
    hikari:
      auto-commit: false
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: SOHT2_SCHEMA_HISTORY
  cache:
    cache-names: userCache
    type: caffeine
    caffeine.spec: maximumSize=1000,expireAfterWrite=${soht2.server.user-cache-ttl}
  web.error:
    include-message: always
    include-stacktrace: never
    include-exception: false

management:
  endpoints.web.exposure.include: health
  endpoint.health.show-details: never

logging.level:
  root: info
  # CachingAuthenticationProvider intentionally wraps the UserDetailsService
  org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: error
  net.soht2.server.config.CachingAuthenticationProvider: info

server:
  address: 0.0.0.0
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - text/plain
      - text/html
      - text/xml
      - text/css
      - text/javascript
      - application/json
      - application/xml
      - application/javascript
      - application/octet-stream
  forward-headers-strategy: native

soht2.server:
  socket-read-timeout: PT0.1S
  download-hold-timeout: PT25S
  read-buffer-size: 1MB
  max-request-size: 4MB
  user-cache-ttl: PT10M
  database-path: ./soht2
  admin-username: admin
  open-api-server-url: http://localhost:8080
  enable-history: true
  abandoned-connections:
    timeout: PT1M
    check-interval: PT5S

springdoc.swagger-ui.path: /swagger-ui